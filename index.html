<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love Frequency</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1>Our Love Frequency</h1>
            <div class="counter-badge">
                ❤️ Together Since May 6, 2024
            </div>
        </header>

        <!-- Navigation Tabs -->
        <nav class="nav-tabs">
            <button class="tab-btn active">📻 Radio FM</button>
            <button class="tab-btn">💌 Letters</button>
            <button class="tab-btn">🖼️ Memories</button>
        </nav>

        <!-- Main Radio Player Card -->
        <main class="player-card">
            <div id="station-frequency" class="frequency-display">107.9 FM</div>
            
            <div class="vinyl-container">
                <div class="vinyl-record spinning" id="vinyl">
                    <div class="vinyl-center">❤️</div>
                </div>
            </div>

            <div class="station-title" id="station-name">Our Memories</div>

            <!-- Audio Element -->
            <audio id="audio-player"></audio>

            <!-- Playback Controls -->
            <div class="controls">
                <button id="prev-btn" class="control-icon">⏮️</button>
                <button id="play-btn" class="play-main-btn">▶</button>
                <button id="next-btn" class="control-icon">⏭️</button>
            </div>
        </main>

        <!-- Station Switcher Buttons -->
        <section class="station-selector">
            <button class="station-select-btn active-station" data-index="0">
                Our Memories 📻 107.9 FM
            </button>
            <button class="station-select-btn" data-index="1">
                Late Night 🌙 98.5 FM
            </button>
        </section>

        <!-- Ambient Sound Effects -->
        <section class="ambient-section">
            <p class="ambient-title">Background Vibes</p>
            <div class="ambient-grid">
                <button class="ambient-btn" data-sound="rain">🌧️ Rain</button>
                <button class="ambient-btn" data-sound="fire">🔥 Fire</button>
                <button class="ambient-btn" data-sound="ocean">🌊 Ocean</button>
                <button class="ambient-btn" data-sound="breeze">🍃 Breeze</button>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Private Radio Station</title>
  <style>
    :root {
      --bg-color: #121216;
      --card-bg: #1e1e24;
      --accent: #ff4757;
      --accent-glow: rgba(255, 71, 87, 0.4);
      --text-main: #f1f2f6;
      --text-muted: #a4b0be;
      --border-color: #2f3542;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }

    header { text-align: center; margin-bottom: 20px; width: 100%; max-width: 500px; }
    header h1 { font-size: 1.8rem; font-weight: 700; color: var(--accent); letter-spacing: 1px; }
    header p { font-size: 0.9rem; color: var(--text-muted); margin-top: 4px; }

    .radio-container { background: var(--card-bg); width: 100%; max-width: 500px; border-radius: 20px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; gap: 20px; position: relative; }

    /* Vinyl Player Display */
    .vinyl-wrapper { width: 220px; height: 220px; position: relative; display: flex; justify-content: center; align-items: center; }
    .vinyl-record { width: 100%; height: 100%; background: radial-gradient(circle, #000 25%, #111 26%, #222 40%, #000 41%, #111 60%, #000 61%); border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.6); animation: spin 4s linear infinite; animation-play-state: paused; }
    .vinyl-record.playing { animation-play-state: running; }
    .album-art { width: 85px; height: 85px; border-radius: 50%; object-fit: cover; border: 4px solid #111; }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    .track-info { text-align: center; width: 100%; }
    .track-title { font-size: 1.2rem; font-weight: 600; }
    .track-subtitle { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }

    /* Controls */
    .controls { display: flex; align-items: center; gap: 20px; margin-top: 10px; }
    .btn-circle { width: 56px; height: 56px; border-radius: 50%; border: none; background: var(--accent); color: white; font-size: 1.2rem; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 12px var(--accent-glow); }
    .btn-secondary { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border-color); background: #2f3542; color: white; cursor: pointer; display: flex; justify-content: center; align-items: center; }

    /* Station Selector */
    .station-selector { display: flex; gap: 10px; width: 100%; overflow-x: auto; padding-bottom: 5px; }
    .station-chip { padding: 8px 16px; border-radius: 20px; background: #2f3542; color: var(--text-muted); font-size: 0.85rem; cursor: pointer; white-space: nowrap; border: 1px solid transparent; }
    .station-chip.active { background: var(--accent); color: white; border-color: var(--accent); }

    /* Admin Trigger */
    .admin-toggle { position: absolute; top: 15px; right: 15px; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; }

    /* Admin Panel */
    .admin-panel { width: 100%; max-width: 500px; background: var(--card-bg); border-radius: 20px; padding: 20px; margin-top: 20px; border: 1px solid var(--border-color); display: none; }
    .admin-panel.active { display: block; }
    .admin-panel h2 { font-size: 1.2rem; margin-bottom: 15px; color: var(--accent); }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px; }
    .form-group input, .form-group select { width: 100%; padding: 10px; background: #121216; border: 1px solid var(--border-color); color: white; border-radius: 8px; font-size: 0.9rem; }
    .recorder-box { display: flex; gap: 10px; align-items: center; margin-bottom: 15px; }
    .btn-action { padding: 10px 15px; border-radius: 8px; border: none; background: var(--accent); color: white; font-weight: 600; cursor: pointer; width: 100%; }
    .btn-recorder { padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border-color); background: #2f3542; color: white; cursor: pointer; }

    /* Track List inside Admin */
    .track-list { margin-top: 20px; }
    .track-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #121216; border-radius: 8px; margin-bottom: 8px; font-size: 0.85rem; }
    .btn-del { background: none; border: none; color: #ff4757; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h1>OUR RADIO STATION</h1>
    <p>A private frequency tuned just for you</p>
  </header>

  <div class="radio-container">
    <button class="admin-toggle" id="adminBtn">⚙️</button>

    <div class="vinyl-wrapper">
      <div class="vinyl-record" id="vinyl">
        <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=300" alt="Album Art" class="album-art" id="albumArt">
      </div>
    </div>

    <div class="track-info">
      <div class="track-title" id="trackTitle">Select a Station</div>
      <div class="track-subtitle" id="trackSubtitle">Tap play to listen</div>
    </div>

    <div class="station-selector" id="stationList">
      <!-- Stations added dynamically -->
    </div>

    <div class="controls">
      <button class="btn-secondary" id="prevBtn">⏮</button>
      <button class="btn-circle" id="playBtn">▶</button>
      <button class="btn-secondary" id="nextBtn">⏭</button>
    </div>
  </div>

  <!-- Hidden Admin Section -->
  <div class="admin-panel" id="adminPanel">
    <h2>Record Voice Note & Add Track</h2>
    
    <div class="form-group">
      <label>Track Title / Note Name</label>
      <input type="text" id="inputTitle" placeholder="e.g. Thinking of you today">
    </div>

    <div class="form-group">
      <label>Station Category</label>
      <select id="inputStation">
        <option value="Late Night">Late Night</option>
        <option value="Pick Me Up">Pick Me Up</option>
        <option value="Memories">Memories</option>
      </select>
    </div>

    <div class="form-group">
      <label>Photo URL (Optional)</label>
      <input type="text" id="inputPhoto" placeholder="Paste image link here">
    </div>

    <div class="recorder-box">
      <button class="btn-recorder" id="recordBtn">🎙️ Record</button>
      <span id="recordStatus" style="font-size:0.8rem; color:var(--text-muted)">Ready</span>
    </div>

    <button class="btn-action" id="saveTrackBtn">Save Track</button>

    <div class="track-list" id="adminTrackList">
      <!-- Admin saved tracks listed here -->
    </div>
  </div>

  <script>
    // App State
    let tracks = [];
    let currentTrackIndex = 0;
    let isPlaying = false;
    let audio = new Audio();
    let mediaRecorder;
    let audioChunks = [];
    let recordedAudioUrl = null;

    // DOM Elements
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const vinyl = document.getElementById('vinyl');
    const albumArt = document.getElementById('albumArt');
    const trackTitle = document.getElementById('trackTitle');
    const trackSubtitle = document.getElementById('trackSubtitle');
    const stationList = document.getElementById('stationList');
    const adminBtn = document.getElementById('adminBtn');
    const adminPanel = document.getElementById('adminPanel');

    // Admin Elements
    const recordBtn = document.getElementById('recordBtn');
    const recordStatus = document.getElementById('recordStatus');
    const saveTrackBtn = document.getElementById('saveTrackBtn');
    const inputTitle = document.getElementById('inputTitle');
    const inputStation = document.getElementById('inputStation');
    const inputPhoto = document.getElementById('inputPhoto');
    const adminTrackList = document.getElementById('adminTrackList');

    // Load initial storage
    function loadTracks() {
      const saved = localStorage.getItem('radio_tracks');
      if (saved) {
        tracks = JSON.parse(saved);
      } else {
        tracks = [
          {
            title: "Welcome Note",
            station: "Memories",
            photo: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=300",
            audioUrl: ""
          }
        ];
      }
      renderStations();
      renderAdminList();
      if (tracks.length > 0) loadTrack(0);
    }

    function saveToStorage() {
      localStorage.setItem('radio_tracks', JSON.stringify(tracks));
    }

    function loadTrack(index) {
      if (tracks.length === 0) return;
      currentTrackIndex = index;
      const track = tracks[index];
      trackTitle.textContent = track.title;
      trackSubtitle.textContent = "Station: " + track.station;
      albumArt.src = track.photo || "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=300";
      
      if (track.audioUrl) {
        audio.src = track.audioUrl;
      } else {
        audio.src = "";
      }
    }

    function renderStations() {
      const stations = [...new Set(tracks.map(t => t.station))];
      stationList.innerHTML = "";
      stations.forEach(st => {
        const chip = document.createElement('div');
        chip.className = 'station-chip';
        chip.textContent = st;
        chip.onclick = () => {
          document.querySelectorAll('.station-chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          const firstInStation = tracks.findIndex(t => t.station === st);
          if (firstInStation !== -1) {
            loadTrack(firstInStation);
            playAudio();
          }
        };
        stationList.appendChild(chip);
      });
    }

    function playAudio() {
      if (!audio.src) return;
      audio.play();
      isPlaying = true;
      playBtn.textContent = '⏸';
      vinyl.classList.add('playing');
    }

    function pauseAudio() {
      audio.pause();
      isPlaying = false;
      playBtn.textContent = '▶';
      vinyl.classList.remove('playing');
    }

    playBtn.onclick = () => {
      if (isPlaying) pauseAudio();
      else playAudio();
    };

    nextBtn.onclick = () => {
      currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
      loadTrack(currentTrackIndex);
      playAudio();
    };

    prevBtn.onclick = () => {
      currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
      loadTrack(currentTrackIndex);
      playAudio();
    };

    audio.onended = () => pauseAudio();

    // Admin Toggle (Passcode check)
    adminBtn.onclick = () => {
      const pass = prompt("Enter Admin Passcode:", "");
      if (pass === "1234") {
        adminPanel.classList.toggle('active');
      } else {
        alert("Incorrect code");
      }
    };

    // Voice Recorder Logic
    recordBtn.onclick = async () => {
      if (!mediaRecorder || mediaRecorder.state === "inactive") {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          
          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = () => {
            const blob = new Blob(audioChunks, { type: 'audio/mp3' });
            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = () => {
              recordedAudioUrl = reader.result;
              recordStatus.textContent = "Recording Saved!";
            };
          };

          mediaRecorder.start();
          recordStatus.textContent = "Recording...";
          recordBtn.textContent = "⏹️ Stop";
        } catch (err) {
          alert("Microphone access denied or not supported.");
        }
      } else {
        mediaRecorder.stop();
        recordBtn.textContent = "🎙️ Record";
      }
    };

    // Save Track
    saveTrackBtn.onclick = () => {
      const title = inputTitle.value.trim();
      const station = inputStation.value;
      const photo = inputPhoto.value.trim();

      if (!title) {
        alert("Please provide a title");
        return;
      }

      tracks.push({
        title: title,
        station: station,
        photo: photo,
        audioUrl: recordedAudioUrl || ""
      });

      saveToStorage();
      renderStations();
      renderAdminList();

      // Reset form
      inputTitle.value = "";
      inputPhoto.value = "";
      recordedAudioUrl = null;
      recordStatus.textContent = "Ready";
      alert("Track saved successfully!");
    };

    function renderAdminList() {
      adminTrackList.innerHTML = "";
      tracks.forEach((t, i) => {
        const item = document.createElement('div');
        item.className = 'track-item';
        item.innerHTML = `
          <span>${t.title} (${t.station})</span>
          <button class="btn-del" onclick="deleteTrack(${i})">🗑️</button>
        `;
        adminTrackList.appendChild(item);
      });
    }

    window.deleteTrack = function(index) {
      tracks.splice(index, 1);
      saveToStorage();
      renderStations();
      renderAdminList();
      if (tracks.length > 0) loadTrack(0);
    };

    // Initialize
    loadTracks();
  </script>
</body>
</html>

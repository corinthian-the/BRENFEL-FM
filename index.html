<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love Frequency</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #ff758c;
            --secondary-pink: #ff7eb3;
            --bg-gradient: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-color: #5d4037;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: var(--bg-gradient);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(255, 117, 140, 0.3);
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            font-family: 'Sacramento', cursive;
            font-size: 2.8rem;
            color: #d81b60;
            margin-bottom: 5px;
        }

        .counter-badge {
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #c2185b;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: inline-block;
            margin-bottom: 10px;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            justify-content: space-around;
            background: rgba(255, 255, 255, 0.6);
            padding: 6px;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .tab-btn {
            background: none;
            border: none;
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            font-size: 0.8rem;
            color: #7b5e57;
            padding: 6px 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--primary-pink);
            color: white;
            box-shadow: 0 4px 10px rgba(255, 117, 140, 0.4);
        }

        .section-content {
            display: none;
        }

        .section-content.active {
            display: block;
        }

        /* Radio Player Section */
        .radio-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            position: relative;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.8);
        }

        .admin-trigger {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .admin-trigger:hover {
            opacity: 1;
        }

        .frequency-display {
            background: #d81b60;
            color: white;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 4px 12px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 15px;
        }

        .vinyl-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 15px auto;
            background: #222;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            position: relative;
            border: 4px solid #444;
        }

        .vinyl-container.spinning {
            animation: spin 4s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .vinyl-center {
            width: 45px;
            height: 45px;
            background: var(--primary-pink);
            border-radius: 50%;
            border: 3px solid white;
            background-size: cover;
            background-position: center;
        }

        .station-info h3 {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 3px;
        }

        .station-info p {
            font-size: 0.8rem;
            color: #777;
            margin-bottom: 15px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .control-btn {
            background: white;
            border: 2px solid var(--primary-pink);
            color: var(--primary-pink);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .control-btn.main-play {
            width: 55px;
            height: 55px;
            background: var(--primary-pink);
            color: white;
            font-size: 1.3rem;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .playlist {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
            justify-content: center;
        }

        .station-chip {
            background: #fce4ec;
            border: none;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #c2185b;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .station-chip.active {
            background: var(--primary-pink);
            color: white;
        }

        /* Memories Section */
        .memories-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
            padding: 5px;
        }

        .memory-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
            padding-bottom: 8px;
        }

        .memory-card img {
            width: 100%;
            height: 110px;
            object-fit: cover;
        }

        .memory-card span {
            font-size: 0.75rem;
            font-weight: 600;
            color: #555;
            display: block;
            margin-top: 5px;
            padding: 0 5px;
        }

        /* Admin Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 380px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .modal-content h2 {
            font-size: 1.3rem;
            color: #d81b60;
            margin-bottom: 15px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #555;
            display: block;
            margin-bottom: 4px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: 'Quicksand', sans-serif;
            font-size: 0.85rem;
        }

        .btn-primary {
            background: var(--primary-pink);
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-secondary {
            background: #eee;
            color: #555;
            border: none;
            width: 100%;
            padding: 8px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }

        .record-box {
            background: #fdf2f4;
            border: 2px dashed var(--primary-pink);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            margin-top: 10px;
        }

        .record-btn {
            background: #e91e63;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: 600;
            margin-top: 5px;
        }

        .record-btn.recording {
            background: #d32f2f;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Our Love Frequency</h1>
            <div class="counter-badge" id="counter">Together Since May 6, 2024</div>
        </header>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('radio')">📻 Radio FM</button>
            <button class="tab-btn" onclick="switchTab('memories')">🖼️ Memories</button>
        </div>

        <!-- RADIO SECTION -->
        <div id="radio-section" class="section-content active">
            <div class="radio-card">
                <button class="admin-trigger" onclick="openAdmin()">⚙️</button>
                <div class="frequency-display" id="freq-display">107.9 FM</div>

                <div class="vinyl-container" id="vinyl">
                    <div class="vinyl-center" id="vinyl-img"></div>
                </div>

                <div class="station-info">
                    <h3 id="station-title">Welcome to Brenfel Fm</h3>
                    <p id="station-desc">Tap play to listen to our love audio</p>
                </div>

                <div class="controls">
                    <button class="control-btn" onclick="prevStation()">⏮</button>
                    <button class="control-btn main-play" id="play-btn" onclick="togglePlay()">▶</button>
                    <button class="control-btn" onclick="nextStation()">⏭</button>
                </div>

                <div class="playlist" id="playlist-chips"></div>
            </div>
        </div>

        <!-- MEMORIES SECTION -->
        <div id="memories-section" class="section-content">
            <div class="memories-grid" id="memories-container"></div>
        </div>
    </div>

    <!-- ADMIN MODAL -->
    <div class="modal" id="admin-modal">
        <div class="modal-content">
            <h2>Admin Settings</h2>
            
            <div id="login-view">
                <div class="form-group">
                    <label>Enter Passcode (Default: 1234)</label>
                    <input type="password" id="passcode-input" placeholder="Enter PIN">
                </div>
                <button class="btn-primary" onclick="verifyAdmin()">Login</button>
                <button class="btn-secondary" onclick="closeAdmin()">Cancel</button>
            </div>

            <div id="settings-view" style="display:none;">
                <div class="form-group">
                    <label>Background Image (Select file or paste URL)</label>
                    <input type="file" id="setting-bg-file" accept="image/*" onchange="uploadBgFile(event)" style="margin-bottom: 5px;">
                    <input type="text" id="setting-bg" placeholder="Paste direct image URL (.jpg/.png)">
                </div>

                <div class="form-group">
                    <label>Station Name</label>
                    <input type="text" id="setting-name" value="Welcome to Brenfel Fm">
                </div>

                <div class="form-group">
                    <label>Audio File (Upload MP3 or paste URL)</label>
                    <input type="file" id="setting-audio-file" accept="audio/*" onchange="uploadAudioFile(event)" style="margin-bottom: 5px;">
                    <input type="text" id="setting-audio" placeholder="https://...file.mp3">
                </div>

                <div class="record-box">
                    <label style="margin-bottom:5px;">Or Record Voice Note Directly:</label>
                    <button class="record-btn" id="rec-toggle-btn" onclick="toggleRecording()">🎙️ Start Recording</button>
                    <p id="rec-status" style="font-size:0.7rem; color:#666; margin-top:5px;">Ready to record</p>
                </div>

                <hr style="margin: 15px 0; border:0; border-top:1px solid #eee;">

                <div class="form-group">
                    <label>Add Memory Photo (Select file or paste URL)</label>
                    <input type="file" id="memory-file" accept="image/*" onchange="uploadMemoryFile(event)" style="margin-bottom: 5px;">
                    <input type="text" id="memory-img-url" placeholder="Paste Image URL">
                </div>
                <div class="form-group">
                    <label>Memory Caption</label>
                    <input type="text" id="memory-caption" placeholder="Our cute moment">
                </div>
                <button class="btn-secondary" onclick="addMemory()">+ Add Memory Photo</button>

                <button class="btn-primary" onclick="saveSettings()">Save & Update Everything</button>
                <button class="btn-secondary" onclick="closeAdmin()">Close</button>
            </div>
        </div>
    </div>

    <audio id="audio-player"></audio>

    <script>
        let appData = JSON.parse(localStorage.getItem('brenfel_love_app_data')) || {
            bgUrl: "",
            stations: [
                {
                    name: "Welcome to Brenfel Fm",
                    freq: "107.9 FM",
                    desc: "Our Special Voice Note",
                    audio: "" 
                },
                {
                    name: "Our Memories",
                    freq: "98.5 FM",
                    desc: "Sweet background melody",
                    audio: ""
                }
            ],
            memories: [
                { url: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=300", caption: "Forever Together ❤️️" }
            ]
        };

        let currentStationIdx = 0;
        let isPlaying = false;
        let mediaRecorder;
        let audioChunks = [];

        const audioPlayer = document.getElementById('audio-player');
        const vinyl = document.getElementById('vinyl');
        const vinylImg = document.getElementById('vinyl-img');
        const playBtn = document.getElementById('play-btn');

        window.onload = function() {
            applyBackground();
            renderStations();
            renderMemories();
            loadStation(0);
            updateCounter();
        };

        function applyBackground() {
            if (appData.bgUrl) {
                document.body.style.backgroundImage = `url('${appData.bgUrl}')`;
            }
        }

        function updateCounter() {
            const startDate = new Date('2024-05-06');
            const now = new Date();
            const diff = now - startDate;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById('counter').innerText = `Together Since May 6, 2024: ${days} Days`;
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));
            
            if(tab === 'radio') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('radio-section').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('memories-section').classList.add('active');
            }
        }

        function renderStations() {
            const container = document.getElementById('playlist-chips');
            container.innerHTML = '';
            appData.stations.forEach((st, idx) => {
                const chip = document.createElement('button');
                chip.className = `station-chip ${idx === currentStationIdx ? 'active' : ''}`;
                chip.innerText = st.name;
                chip.onclick = () => {
                    currentStationIdx = idx;
                    loadStation(idx);
                    renderStations();
                };
                container.appendChild(chip);
            });
        }

        function loadStation(idx) {
            const st = appData.stations[idx];
            document.getElementById('freq-display').innerText = st.freq;
            document.getElementById('station-title').innerText = st.name;
            document.getElementById('station-desc').innerText = st.desc;
            
            if(appData.memories.length > 0) {
                vinylImg.style.backgroundImage = `url('${appData.memories[0].url}')`;
            }

            audioPlayer.src = st.audio || '';
        }

        function togglePlay() {
            const currentSt = appData.stations[currentStationIdx];
            if (!currentSt.audio) {
                alert("No audio file or voice recording provided for this station! Add one in Admin Settings (⚙️).");
                return;
            }

            if (isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
                playBtn.innerText = "▶";
                vinyl.classList.remove('spinning');
            } else {
                audioPlayer.play().then(() => {
                    isPlaying = true;
                    playBtn.innerText = "⏸";
                    vinyl.classList.add('spinning');
                }).catch(err => {
                    alert("Playback failed. Please check your audio source.");
                });
            }
        }

        audioPlayer.onended = function() {
            isPlaying = false;
            playBtn.innerText = "▶";
            vinyl.classList.remove('spinning');
        };

        function nextStation() {
            currentStationIdx = (currentStationIdx + 1) % appData.stations.length;
            renderStations();
            loadStation(currentStationIdx);
            if(isPlaying) togglePlay();
        }

        function prevStation() {
            currentStationIdx = (currentStationIdx - 1 + appData.stations.length) % appData.stations.length;
            renderStations();
            loadStation(currentStationIdx);
            if(isPlaying) togglePlay();
        }

        function renderMemories() {
            const container = document.getElementById('memories-container');
            container.innerHTML = '';
            appData.memories.forEach(mem => {
                const card = document.createElement('div');
                card.className = 'memory-card';
                card.innerHTML = `
                    <img src="${mem.url}" alt="Memory">
                    <span>${mem.caption}</span>
                `;
                container.appendChild(card);
            });
        }

        function openAdmin() {
            document.getElementById('admin-modal').style.display = 'flex';
        }

        function closeAdmin() {
            document.getElementById('admin-modal').style.display = 'none';
            document.getElementById('login-view').style.display = 'block';
            document.getElementById('settings-view').style.display = 'none';
            document.getElementById('passcode-input').value = '';
        }

        function verifyAdmin() {
            const pin = document.getElementById('passcode-input').value;
            if(pin === '1234') {
                document.getElementById('login-view').style.display = 'none';
                document.getElementById('settings-view').style.display = 'block';
                
                document.getElementById('setting-bg').value = appData.bgUrl || '';
                document.getElementById('setting-name').value = appData.stations[currentStationIdx].name;
                document.getElementById('setting-audio').value = appData.stations[currentStationIdx].audio || '';
            } else {
                alert('Incorrect Passcode!');
            }
        }

        // Direct File Handlers so uploading from phone works smoothly
        function uploadBgFile(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('setting-bg').value = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function uploadAudioFile(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('setting-audio').value = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function uploadMemoryFile(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('memory-img-url').value = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        let recording = false;
        async function toggleRecording() {
            const recBtn = document.getElementById('rec-toggle-btn');
            const recStatus = document.getElementById('rec-status');

            if (!recording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = function() {
                            document.getElementById('setting-audio').value = reader.result;
                            recStatus.innerText = "Recording saved! Click Save below.";
                        };
                    };

                    mediaRecorder.start();
                    recording = true;
                    recBtn.innerText = "⏹️ Stop Recording";
                    recBtn.classList.add('recording');
                    recStatus.innerText = "Recording voice... speak now.";
                } catch (err) {
                    alert("Microphone permission denied or not supported.");
                }
            } else {
                mediaRecorder.stop();
                recording = false;
                recBtn.innerText = "🎙️ Record Again";
                recBtn.classList.remove('recording');
            }
        }

        function addMemory() {
            const url = document.getElementById('memory-img-url').value;
            const caption = document.getElementById('memory-caption').value;
            if(url) {
                appData.memories.push({ url, caption: caption || "Our Memory ❤️" });
                document.getElementById('memory-img-url').value = '';
                document.getElementById('memory-caption').value = '';
                document.getElementById('memory-file').value = '';
                renderMemories();
                alert("Memory added successfully!");
            } else {
                alert("Please select or paste an image.");
            }
        }

        function saveSettings() {
            appData.bgUrl = document.getElementById('setting-bg').value;
            appData.stations[currentStationIdx].name = document.getElementById('setting-name').value;
            appData.stations[currentStationIdx].audio = document.getElementById('setting-audio').value;

            localStorage.setItem('brenfel_love_app_data', JSON.stringify(appData));
            
            applyBackground();
            renderStations();
            loadStation(currentStationIdx);
            closeAdmin();
            alert("Changes saved successfully!");
        }
    </script>
</body>
</html>
